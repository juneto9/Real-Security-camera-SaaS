name: real-security-camera
region: nyc
services:
- name: backend
  source_dir: /backend
  github:
    repo: juneto9/Real-Security-camera-SaaS
    branch: main
    deploy_on_push: true
  dockerfile_path: backend/Dockerfile
  http_port: 3000
  instance_size_slug: basic-xxs
  instance_count: 1
  health_check:
    http_path: /health
    initial_delay_seconds: 20
    period_seconds: 30
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  - key: DB_HOST
    value: YOUR_DB_HOST
    type: SECRET
  - key: DB_PORT
    value: "25060"
  - key: DB_NAME
    value: defaultdb
  - key: DB_USER
    value: doadmin
    type: SECRET
  - key: DB_PASSWORD
    value: YOUR_DB_PASSWORD
    type: SECRET
  - key: DB_SSL
    value: "true"
  - key: JWT_SECRET
    value: YOUR_JWT_SECRET
    type: SECRET
  - key: JWT_EXPIRE
    value: 7d
  - key: STORAGE_TYPE
    value: spaces
  - key: STORAGE_ENDPOINT
    value: https://nyc3.digitaloceanspaces.com
  - key: STORAGE_REGION
    value: nyc3
  - key: STORAGE_BUCKET
    value: real-security-camera-recordings
  - key: STORAGE_ACCESS_KEY
    value: YOUR_SPACES_ACCESS_KEY
    type: SECRET
  - key: STORAGE_SECRET_KEY
    value: YOUR_SPACES_SECRET_KEY
    type: SECRET
  - key: BCRYPT_ROUNDS
    value: "10"
  - key: MOTION_DETECTION_ENABLED
    value: "true"
  - key: RECORDING_RETENTION_DAYS
    value: "11"
  - key: MOTION_TRIGGER_DURATION
    value: "30"
