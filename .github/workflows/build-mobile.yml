name: Build RSC Mobile

on:
  push:
    paths:
      - 'mobile/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Download AI models from DO Spaces
        working-directory: mobile
        env:
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
        run: |
          mkdir -p assets/models
          # Download YOLOv8n TFLite models from DO Spaces
          # Models are stored at: real-security-camera-recordings/ai-models/
          curl -f "https://real-security-camera-recordings.nyc3.digitaloceanspaces.com/ai-models/yolov8n.tflite" \
            -o assets/models/yolov8n.tflite || echo "Model not yet uploaded — build will use placeholder"
          curl -f "https://real-security-camera-recordings.nyc3.digitaloceanspaces.com/ai-models/yolov8n_pose.tflite" \
            -o assets/models/yolov8n_pose.tflite || echo "Pose model not yet uploaded"
          curl -f "https://real-security-camera-recordings.nyc3.digitaloceanspaces.com/ai-models/blazeface.tflite" \
            -o assets/models/blazeface.tflite || echo "BlazeFace not yet uploaded"
          ls -lh assets/models/

      - name: Build Android APK (Preview)
        working-directory: mobile
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build \
            --platform android \
            --profile $PROFILE \
            --non-interactive \
            --output ../rsc-mobile-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsc-mobile-android-${{ github.sha }}
          path: rsc-mobile-android.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: RSC Mobile Android v${{ github.run_number }}
          body: |
            ## RSC Mobile — Android APK

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### What's in this build
            - Dual-stream PiP camera (front + rear via LiveKit)
            - YOLOv8n on-device AI (object detection, pose, face)
            - Android ARP network discovery
            - GPS geofence auto-arm
            - Audio classification (glass break, alarm, dog bark)
            - Cloud recording to DO Spaces
            - RSC branded UI (red/black/white)

            ### Install
            1. Download `RSC-Mobile-Android.apk`
            2. On your Android phone: Settings → Security → Allow unknown sources
            3. Open the APK and install
            4. Login with your RSC account

            ### First run
            Accept all permission prompts — camera, microphone, location, and network access are all required.
          files: rsc-mobile-android.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS (Simulator)
    runs-on: macos-latest
    if: |
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Download AI models
        working-directory: mobile
        run: |
          mkdir -p assets/models
          curl -f "https://real-security-camera-recordings.nyc3.digitaloceanspaces.com/ai-models/yolov8n.tflite" \
            -o assets/models/yolov8n.tflite || echo "Model placeholder"
          curl -f "https://real-security-camera-recordings.nyc3.digitaloceanspaces.com/ai-models/yolov8n_pose.tflite" \
            -o assets/models/yolov8n_pose.tflite || echo "Pose placeholder"
          curl -f "https://real-security-camera-recordings.nyc3.digitaloceanspaces.com/ai-models/blazeface.tflite" \
            -o assets/models/blazeface.tflite || echo "BlazeFace placeholder"

      - name: Build iOS Simulator
        working-directory: mobile
        run: |
          eas build \
            --platform ios \
            --profile development \
            --non-interactive

