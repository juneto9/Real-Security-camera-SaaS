name: Build & Release Discovery Agent

on:
  push:
    paths:
      - 'scripts/discovery-agent.js'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: node18-win-x64
            artifact: RealSecCam-Discovery-Agent-Windows.exe
          - os: macos-latest
            target: node18-macos-x64
            artifact: RealSecCam-Discovery-Agent-macOS
          - os: ubuntu-latest
            target: node18-linux-x64
            artifact: RealSecCam-Discovery-Agent-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd scripts
          echo '{"name":"discovery-agent","version":"2.0.0","dependencies":{"axios":"^1.6.0"}}' > package.json
          npm install --no-fund --no-audit

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build binary
        run: |
          pkg scripts/discovery-agent.js --target ${{ matrix.target }} --output scripts/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: scripts/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: Discovery Agent - Latest Build
          body: |
            ## RealSecCam Discovery Agent
            Auto-built binaries for Windows, macOS, and Linux.
            Download the file for your platform and run it directly — no installation required.
          files: dist/**
          prerelease: false
