name: Build & Release Discovery Agent

on:
  push:
    paths:
      - 'scripts/discovery-agent.js'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps and build
        run: |
          cd scripts
          echo {"name":"discovery-agent","version":"2.0.0","dependencies":{"axios":"^1.6.0"}} > package.json
          npm install --no-fund --no-audit
          npm install -g pkg
          pkg agent.js --target node18-win-x64 --output RealSecCam-Discovery-Agent-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: scripts/RealSecCam-Discovery-Agent-Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps and build
        run: |
          cd scripts
          echo '{"name":"discovery-agent","version":"2.0.0","dependencies":{"axios":"^1.6.0"}}' > package.json
          npm install --no-fund --no-audit
          npm install -g pkg
          pkg agent.js --target node18-macos-x64 --output RealSecCam-Discovery-Agent-macOS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: scripts/RealSecCam-Discovery-Agent-macOS

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps and build
        run: |
          cd scripts
          echo '{"name":"discovery-agent","version":"2.0.0","dependencies":{"axios":"^1.6.0"}}' > package.json
          npm install --no-fund --no-audit
          npm install -g pkg
          pkg agent.js --target node18-linux-x64 --output RealSecCam-Discovery-Agent-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: scripts/RealSecCam-Discovery-Agent-Linux

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: Discovery Agent - Latest Build
          body: |
            ## RealSecCam Discovery Agent
            Download the binary for your platform and run it directly.
            No installation required.
          files: dist/*
          make_latest: true
