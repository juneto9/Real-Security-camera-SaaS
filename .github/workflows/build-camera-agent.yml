name: Build Camera Agent v2.3.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.3.0)'
        required: true
        default: '2.3.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Embed Windows version metadata
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

          $v = "${{ github.event.inputs.version }}"
          $parts = $v -split '\.'
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $json = @{
            FixedFileInfo = @{
              FileVersion = @{ Major = $major; Minor = $minor; Patch = $patch; Build = 0 }
              ProductVersion = @{ Major = $major; Minor = $minor; Patch = $patch; Build = 0 }
              FileFlagsMask = "3f"
              FileFlags = "00"
              FileOS = "040004"
              FileType = "01"
              FileSubType = "00"
            }
            StringFileInfo = @{
              CompanyName = "Poken Holdings, Inc."
              FileDescription = "RSC Camera Agent"
              ProductName = "RSC Camera Agent"
              ProductVersion = $v
              FileVersion = $v
              OriginalFilename = "rsc-camera-agent.exe"
              LegalCopyright = "Copyright Poken Holdings, Inc."
            }
            VarFileInfo = @{
              Translation = @{ LangID = "0409"; CharsetID = "04B0" }
            }
          } | ConvertTo-Json -Depth 4

          Set-Content -Path rsc-camera-agent\versioninfo.json -Value $json
          goversioninfo -platform-specific rsc-camera-agent\versioninfo.json
          Write-Host "Generated resource.syso with version $v"

      - name: Build agent
        working-directory: rsc-camera-agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go mod tidy
          go build -ldflags="-s -w -X main.AppVersion=${{ github.event.inputs.version }}" -o ..\pkg\rsc-camera-agent.exe .

      - name: Download livekit-cli
        shell: pwsh
        run: |
          $v = "2.16.5"
          Invoke-WebRequest "https://github.com/livekit/livekit-cli/releases/download/v${v}/lk_${v}_windows_amd64.zip" -OutFile lk.zip
          Expand-Archive lk.zip -DestinationPath lk_temp\
          Move-Item -Force lk_temp\lk.exe pkg\livekit-cli.exe

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp\
          $ffDir = Get-ChildItem ffmpeg_temp -Directory | Select-Object -First 1
          Copy-Item "$($ffDir.FullName)\bin\ffmpeg.exe" pkg\ffmpeg.exe

      - name: Create default config
        shell: pwsh
        run: |
          @'
          {
            "camera_id": "PASTE_YOUR_CAMERA_ID_HERE",
            "token_url": "https://livekit.realsecuritycamera.com/livekit-token",
            "livekit_url": "wss://livekit.realsecuritycamera.com",
            "device_name": "",
            "identity": ""
          }
          '@ | Out-File -Encoding utf8 pkg\agent_config.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Create NSIS script
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          @"
          !include "MUI2.nsh"

          Name "RSC Camera Agent"
          OutFile "..\RSC-Camera-Agent-Setup-v$ver.exe"
          InstallDir "`$LOCALAPPDATA\RSCCameraAgent"

          ; ── Auto-uninstall any previous version ──
          !define PREV_INSTALL_DIR "`$LOCALAPPDATA\RSCCameraAgent"
          !define PREV_UNINSTALLER "`${PREV_INSTALL_DIR}\Uninstall.exe"
          !macro AutoUninstall
            IfFileExists "`${PREV_UNINSTALLER}" 0 skip_uninstall
              DetailPrint "Removing previous RSC Camera Agent..."
              ExecWait '"`${PREV_UNINSTALLER}" /S _?=`${PREV_INSTALL_DIR}'
              RMDir /r "`${PREV_INSTALL_DIR}"
            skip_uninstall:
          !macroend
          RequestExecutionLevel user

          !define MUI_ICON "${NSISDIR}\Contrib\Graphics\Icons\modern-install.ico"
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            !insertmacro AutoUninstall
            SetOutPath `$INSTDIR
            File "rsc-camera-agent.exe"
            File "livekit-cli.exe"
            File "ffmpeg.exe"
            File "agent_config.json"

            ; Startup shortcut
            CreateShortCut "`$SMSTARTUP\RSCCameraAgent.lnk" "`$INSTDIR\rsc-camera-agent.exe" "" "`$INSTDIR\rsc-camera-agent.exe"

            ; Uninstaller
            WriteUninstaller "`$INSTDIR\Uninstall.exe"

            ; Add/Remove Programs
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "DisplayName" "RSC Camera Agent"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "UninstallString" '"`$INSTDIR\Uninstall.exe"'
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "Publisher" "Poken Holdings, Inc."
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "DisplayVersion" "$ver"

            ; Start the agent — will prompt for 6-digit code on first run
            Exec '"`$INSTDIR\rsc-camera-agent.exe"'

            MessageBox MB_OK "RSC Camera Agent v$ver installed!`$`n`$`nA registration window will appear.`$`nEnter the 6-digit code from your RSC dashboard.`$`n`$`nThe agent will then stream your camera automatically."
          SectionEnd

          Section "Uninstall"
            nsExec::ExecToLog 'taskkill /F /IM rsc-camera-agent.exe'
            nsExec::ExecToLog 'taskkill /F /IM ffmpeg.exe'
            Delete "`$SMSTARTUP\RSCCameraAgent.lnk"
            Delete "`$INSTDIR\rsc-camera-agent.exe"
            Delete "`$INSTDIR\livekit-cli.exe"
            Delete "`$INSTDIR\ffmpeg.exe"
            Delete "`$INSTDIR\agent_config.json"
            Delete "`$INSTDIR\rsc-agent.log"
            Delete "`$INSTDIR\Uninstall.exe"
            Delete "`$INSTDIR\VERSION.txt"
            RMDir "`$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent"
            MessageBox MB_OK "RSC Camera Agent has been removed."
          SectionEnd
          "@ | Out-File -Encoding ascii pkg\installer.nsi

      - name: Build NSIS installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" pkg\installer.nsi
          $ver = "${{ github.event.inputs.version }}"
          $setupFile = "RSC-Camera-Agent-Setup-v$ver.exe"
          Write-Host "Installer built: $setupFile"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSC-Camera-Agent-Setup-v${{ github.event.inputs.version }}
          path: RSC-Camera-Agent-Setup-v${{ github.event.inputs.version }}.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RSC-Camera-Agent-Setup-v${{ github.event.inputs.version }}
          path: ./release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: camera-agent-v${{ github.event.inputs.version }}
          name: "RSC Camera Agent v${{ github.event.inputs.version }}"
          body: |
            ## RSC Camera Agent v${{ github.event.inputs.version }}

            **Download RSC-Camera-Agent-Setup-v${{ github.event.inputs.version }}.exe and double-click.**

            On first run, the agent auto-registers and streams your camera to LiveKit.
            No browser tab needed.

            Includes: agent + livekit-cli + FFmpeg (all bundled)

            **Version:** Right-click rsc-camera-agent.exe → Properties → Details shows v${{ github.event.inputs.version }}
          files: |
            ./release-artifacts/RSC-Camera-Agent-Setup-v${{ github.event.inputs.version }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
