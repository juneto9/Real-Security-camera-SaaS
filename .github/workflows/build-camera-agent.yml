name: Build Camera Agent
run-name: Build Camera Agent v${{ github.event.inputs.version || '1.1.6' }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.1.1)'
        required: true
        default: '1.1.6'
  push:
    paths:
      - 'rsc-camera-agent/**'
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build RSC Camera Agent
        working-directory: rsc-camera-agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          AGENT_VERSION: ${{ github.event.inputs.version || '1.1.6' }}
        run: |
          go mod tidy
          go build -ldflags="-s -w -X main.Version=${env:AGENT_VERSION}" -o ../installer/rsc-camera-agent.exe .
        shell: pwsh

      - name: Download livekit-cli
        run: |
          $ErrorActionPreference = "Stop"
          $version = "2.16.5"
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          New-Item -ItemType Directory -Force -Path lk_tmp | Out-Null
          Invoke-WebRequest -Uri "https://github.com/livekit/livekit-cli/releases/download/v${version}/lk_${version}_windows_amd64.zip" -OutFile lk.zip
          Expand-Archive -Path lk.zip -DestinationPath lk_tmp -Force
          # The zip may contain lk.exe or a versioned name in a nested folder — find it robustly
          $exe = Get-ChildItem -Path lk_tmp -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "livekit-cli exe not found in archive" }
          Copy-Item $exe.FullName -Destination installer/livekit-cli.exe -Force
          Write-Host "Bundled livekit-cli from $($exe.Name)"
        shell: pwsh

      - name: Create default config
        run: |
          @'
          {
            "camera_id": "PASTE_YOUR_CAMERA_ID_HERE",
            "token_url": "https://livekit.realsecuritycamera.com/livekit-token",
            "livekit_url": "wss://livekit.realsecuritycamera.com",
            "device_name": "",
            "identity": ""
          }
          '@ | Out-File -Encoding utf8 installer/agent_config.json
        shell: pwsh

      - name: Create silent installer script
        run: |
          @'
          @echo off
          echo ============================================
          echo   RSC Camera Agent - Installing...
          echo ============================================

          net session >nul 2>&1
          if %errorLevel% neq 0 (
              echo Requesting administrator access...
              powershell -Command "Start-Process '%~f0' -Verb RunAs"
              exit /b
          )

          set INSTALL_DIR=%ProgramFiles%\RSCCameraAgent
          mkdir "%INSTALL_DIR%" 2>nul

          copy /Y "%~dp0rsc-camera-agent.exe" "%INSTALL_DIR%\"
          copy /Y "%~dp0livekit-cli.exe" "%INSTALL_DIR%\"
          copy /Y "%~dp0agent_config.json" "%INSTALL_DIR%\"

          "%INSTALL_DIR%\rsc-camera-agent.exe" -install
          net start RSCCameraAgent

          msg * "RSC Camera Agent installed successfully! The agent is now running as a background service."

          exit /b 0
          '@ | Out-File -Encoding ascii installer/install.bat
        shell: pwsh

      - name: Create uninstaller
        run: |
          @'
          @echo off
          net session >nul 2>&1
          if %errorLevel% neq 0 (
              powershell -Command "Start-Process '%~f0' -Verb RunAs"
              exit /b
          )
          net stop RSCCameraAgent 2>nul
          "%ProgramFiles%\RSCCameraAgent\rsc-camera-agent.exe" -uninstall
          rmdir /S /Q "%ProgramFiles%\RSCCameraAgent" 2>nul
          msg * "RSC Camera Agent has been removed."
          '@ | Out-File -Encoding ascii installer/uninstall.bat
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis -y
        shell: cmd

      - name: Create NSIS installer script
        env:
          AGENT_VERSION: ${{ github.event.inputs.version || '1.1.6' }}
        run: |
          @'
          !include "MUI2.nsh"

          Name "RSC Camera Agent @@VER@@"
          OutFile "..\RSC-Camera-Agent-Setup.exe"
          InstallDir "$PROGRAMFILES\RSCCameraAgent"
          RequestExecutionLevel admin
          VIProductVersion "@@VER@@.0"
          VIAddVersionKey "ProductName" "RSC Camera Agent"
          VIAddVersionKey "FileVersion" "@@VER@@"
          VIAddVersionKey "ProductVersion" "@@VER@@"
          VIAddVersionKey "CompanyName" "Poken Holdings, Inc."

          !insertmacro MUI_PAGE_INSTFILES
                      !include "FileFunc.nsh"
            !insertmacro GetFileName
            !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            ; Stop any previously-installed agent so its EXE isn't locked during overwrite
            nsExec::ExecToLog 'net stop RSCCameraAgent'
            nsExec::ExecToLog '"$INSTDIR\rsc-camera-agent.exe" -uninstall'
            nsExec::ExecToLog 'taskkill /F /IM rsc-camera-agent.exe'
            Sleep 2000

            SetOutPath $INSTDIR
            File "rsc-camera-agent.exe"
            File "livekit-cli.exe"
            File "install.bat"
            File "uninstall.bat"
            File "agent_config.json"

            nsExec::ExecToLog '"$INSTDIR\rsc-camera-agent.exe" -install'
            nsExec::ExecToLog 'net start RSCCameraAgent'

            WriteUninstaller "$INSTDIR\Uninstall.exe"

            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "DisplayName" "RSC Camera Agent"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "DisplayVersion" "@@VER@@"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "UninstallString" '"$INSTDIR\Uninstall.exe"'
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent" "Publisher" "Poken Holdings, Inc."

            MessageBox MB_OK "RSC Camera Agent @@VER@@ installed successfully!$\n$\nYour camera is now running in the background and will connect automatically. You can close this window.$\n$\nWatch the live feed and controls anytime from your RSC dashboard."
          SectionEnd

          Section "Uninstall"
            nsExec::ExecToLog 'net stop RSCCameraAgent'
            nsExec::ExecToLog '"$INSTDIR\rsc-camera-agent.exe" -uninstall'

            Delete "$INSTDIR\rsc-camera-agent.exe"
            Delete "$INSTDIR\livekit-cli.exe"
            Delete "$INSTDIR\agent_config.json"
            Delete "$INSTDIR\install.bat"
            Delete "$INSTDIR\uninstall.bat"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"

            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\RSCCameraAgent"
          SectionEnd
          '@ -replace '@@VER@@', $env:AGENT_VERSION | Out-File -Encoding ascii installer/installer.nsi
        shell: pwsh

      - name: Build NSIS installer
        env:
          AGENT_VERSION: ${{ github.event.inputs.version || '1.1.6' }}
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\installer.nsi
          Copy-Item RSC-Camera-Agent-Setup.exe "RSC-Camera-Agent-Setup-v$env:AGENT_VERSION.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSC-Camera-Agent-Setup
          path: |
            RSC-Camera-Agent-Setup.exe
            RSC-Camera-Agent-Setup-v*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build RSC Camera Agent
        working-directory: rsc-camera-agent
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
          AGENT_VERSION: ${{ github.event.inputs.version || '1.1.6' }}
        run: |
          go mod tidy
          go build -ldflags="-s -w -X main.Version=${AGENT_VERSION}" -o ../dist/rsc-camera-agent .

      - name: Download livekit-cli
        run: |
          curl -L "https://github.com/livekit/livekit-cli/releases/download/v2.16.5/lk_2.16.5_linux_amd64.tar.gz" | tar -xz -C dist/
          mv dist/lk dist/livekit-cli 2>/dev/null || true

      - name: Create config
        run: |
          cat > dist/agent_config.json << 'EOF'
          {
            "camera_id": "PASTE_YOUR_CAMERA_ID_HERE",
            "token_url": "https://livekit.realsecuritycamera.com/livekit-token",
            "livekit_url": "wss://livekit.realsecuritycamera.com",
            "device_name": "",
            "identity": ""
          }
          EOF

      - name: Package
        run: |
          chmod +x dist/rsc-camera-agent dist/livekit-cli
          cd dist && tar -czf ../RSC-Camera-Agent-linux-amd64.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSC-Camera-Agent-linux
          path: RSC-Camera-Agent-linux-amd64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: camera-agent-v${{ github.event.inputs.version }}
          name: "RSC Camera Agent v${{ github.event.inputs.version }}"
          body: |
            ## RSC Camera Agent v${{ github.event.inputs.version }}

            **Windows:** Download `RSC-Camera-Agent-Setup-v${{ github.event.inputs.version }}.exe`, double-click, done.
            **Linux:** Download the tar.gz, extract, edit config, run install.

            > Stable filename `RSC-Camera-Agent-Setup.exe` always points to this version too.
          files: |
            RSC-Camera-Agent-Setup.exe
            RSC-Camera-Agent-Setup-v*.exe
            RSC-Camera-Agent-linux-amd64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
