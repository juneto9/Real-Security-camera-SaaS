name: Build & Release Streamer
run-name: "RealSecCam Streamer v1.0.0"

on:
  push:
    paths:
      - 'streamer.go'
      - 'streamer_windows.go'
      - 'streamer_unix.go'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: RealSecCam-Streamer-v1.0.0-Linux
            ldflags: '-s -w'
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            output: RealSecCam-Streamer-v1.0.0-Windows.exe
            ldflags: '-s -w -H windowsgui'
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: RealSecCam-Streamer-v1.0.0-macOS
            ldflags: "-s -w"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="${{ matrix.ldflags }}" -o "${{ matrix.output }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-streamer-${{ matrix.goos }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-streamer-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: streamer-v1.0.0
          name: "RealSecCam Streamer v1.0.0"
          body: |
            ## RealSecCam Streamer v1.0.0
            Captures your local webcam and streams it to the Cloud Relay.
            Download, run once — streams automatically on startup.
            | Platform | File |
            |----------|------|
            | **Windows** | RealSecCam-Streamer-v1.0.0-Windows.exe |
            | **macOS** | RealSecCam-Streamer-v1.0.0-macOS |
            | **Linux** | RealSecCam-Streamer-v1.0.0-Linux |
          files: dist/*
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}