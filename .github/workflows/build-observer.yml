name: Build & Release ObserverStreamer
run-name: "RealSecCam ObserverStreamer v1.1.2 — ${{ github.event_name }}"

on:
  push:
    paths:
      - 'observer.go'
      - 'observer_windows.go'
      - 'observer_unix.go'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: ObserverStreamer1.1.2-Linux
            ldflags: '-s -w'
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            output: ObserverStreamer1.1.2.exe
            ldflags: '-s -w'
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: ObserverStreamer1.1.2-macOS
            ldflags: "-s -w"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="${{ matrix.ldflags }}" -o "${{ matrix.output }}" .

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp "${{ matrix.output }}" "staging/${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.goos }}
          path: staging/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: observer-v1.1.2
          name: "RealSecCam ObserverStreamer v1.1.2"
          body: |
            ## RealSecCam ObserverStreamer v1.1.2
            Single binary. Double-click and done. No installation, no dependencies.
            Runs silently in the background — discovers cameras on your network AND streams your webcam to the dashboard.
            | Platform | File |
            |----------|------|
            | **Windows** | ObserverStreamer1.1.2.exe |
            | **macOS** | ObserverStreamer1.1.2-macOS |
            | **Linux** | ObserverStreamer1.1.2-Linux |
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
