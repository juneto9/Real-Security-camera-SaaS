name: Build & Release Observer

on:
  push:
    paths:
      - 'observer.go'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: RealSecCam-Observer-v2.0-Linux
            ldflags: "-s -w"
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            output: RealSecCam-Observer-v2.0-Windows.exe
            ldflags: "-s -w -H windowsgui"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: RealSecCam-Observer-v2.0-macOS
            ldflags: "-s -w"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.output }} observer.go

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete existing observer-latest tag
        continue-on-error: true
        run: |
          gh release delete observer-latest --yes --repo ${{ github.repository }} || true
          git push origin :refs/tags/observer-latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: observer-latest
          name: "RealSecCam Observer v2.0.0"
          body: |
            ## RealSecCam Observer v2.0
            Download and double-click. No installation required. Runs silently in the background.
            | Platform | File |
            |----------|------|
            | **Windows** | RealSecCam-Observer-v2.0-Windows.exe |
            | **macOS** | RealSecCam-Observer-v2.0-macOS |
            | **Linux** | RealSecCam-Observer-v2.0-Linux |
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}