name: Build & Release Observer

on:
  push:
    paths:
      - 'agent/observer.go'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: RealSecCam-Observer-Windows.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: RealSecCam-Observer-macOS
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: RealSecCam-Observer-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.artifact }} agent/observer.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete existing release tag
        continue-on-error: true
        run: |
          gh release delete observer-latest --yes --repo ${{ github.repository }} || true
          git push origin :refs/tags/observer-latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: observer-latest
          name: "RealSecCam Observer — Latest"
          body: |
            ## RealSecCam Observer — Network Discovery Agent

            Download the file for your platform and double-click to run.
            No installation wizard needed — single self-contained executable.

            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** | RealSecCam-Observer-Windows.exe | Double-click to run |
            | **macOS** | RealSecCam-Observer-macOS | Run: `chmod +x` then double-click |
            | **Linux** | RealSecCam-Observer-Linux | Run: `chmod +x` then execute |

            Once running, your machine and discovered cameras appear in the dashboard within 15 seconds.
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
