name: Build & Release Observer

on:
  push:
    paths:
      - 'observer.go'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: RealSecCam-Observer-v${vShort}-Linux
            ldflags: "-s -w"
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            output: RealSecCam-Observer-v${vShort}-Windows.exe
            ldflags: "-s -w -H windowsgui"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: RealSecCam-Observer-v${vShort}-macOS
            ldflags: "-s -w"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="${{ matrix.ldflags }}" -o "${{ matrix.output }}" .

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp "${{ matrix.output }}" "staging/${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.goos }}
          path: staging/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: observer-v2.4.1
          name: "RealSecCam Observer v2.4.1"
          body: |
            ## RealSecCam Observer v2.4.1
            Download and double-click. No installation required. Runs silently in the background.
            | Platform | File |
            |----------|------|
            | **Windows** | RealSecCam-Observer-v${vShort}-Windows.exe |
            | **macOS** | RealSecCam-Observer-v${vShort}-macOS |
            | **Linux** | RealSecCam-Observer-v${vShort}-Linux |
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}