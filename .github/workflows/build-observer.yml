name: Build & Release Observer v1.4

on:
  push:
    paths:
      - 'observer.go'
      - 'observer_icon.png'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          go mod init realseccam/observer || true
          go get github.com/getlantern/systray@latest
          go mod tidy

      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          go build -ldflags="-H windowsgui -s -w" -o RealSecCam-Observer-Windows.exe observer.go

      - uses: actions/upload-artifact@v4
        with:
          name: RealSecCam-Observer-Windows.exe
          path: RealSecCam-Observer-Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          go mod init realseccam/observer || true
          go get github.com/getlantern/systray@latest
          go mod tidy

      - name: Build macOS binary
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          go build -ldflags="-s -w" -o RealSecCam-Observer-macOS observer.go

      - uses: actions/upload-artifact@v4
        with:
          name: RealSecCam-Observer-macOS
          path: RealSecCam-Observer-macOS

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux tray dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev gcc

      - name: Install Go dependencies
        run: |
          go mod init realseccam/observer || true
          go get github.com/getlantern/systray@latest
          go mod tidy

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          go build -ldflags="-s -w" -o RealSecCam-Observer-Linux observer.go

      - uses: actions/upload-artifact@v4
        with:
          name: RealSecCam-Observer-Linux
          path: RealSecCam-Observer-Linux

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete existing release tag
        continue-on-error: true
        run: |
          gh release delete observer-latest --yes --repo ${{ github.repository }} || true
          git push origin :refs/tags/observer-latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: observer-latest
          name: "RealSecCam Observer v1.4 — Latest"
          body: |
            ## RealSecCam Observer v1.4 — Network Discovery Agent

            **Zero-touch. Download and double-click. That's it.**

            The Observer runs silently in your system tray and automatically:
            - Discovers all cameras on your network every 30 seconds
            - Reports them to your RealSecCam dashboard
            - Registers itself to start on every boot (no manual setup)
            - Restarts itself automatically if something goes wrong

            ### How to use
            | Platform | File | Instructions |
            |----------|------|--------------|
            | **Windows** | RealSecCam-Observer-Windows.exe | Double-click to run |
            | **macOS** | RealSecCam-Observer-macOS | Right-click → Open (first time only) |
            | **Linux** | RealSecCam-Observer-Linux | `chmod +x` then double-click |

            ### Tray Icon Controls
            - **Left-click** → Show/Hide log window
            - **Right-click** → Show Logs / Restart Scanner / Quit

            ### Troubleshooting
            Check `observer-diag.json` (created next to the binary) for diagnostic information.
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
